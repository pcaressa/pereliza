<!DOCTYPE html>
<html>

<head>
    <title>BASIC66</title>
    <style>
        body {
            background: #000; color: #0f0; font-family: monospace; padding: 20px;
            font-size: 18px; display: flex; align-items: left; white-space: pre;
        }
    </style>
</head>

<body id="terminal"></body>

<script>

"use scripts";

/// Runtime environment: global object, it is right so.
const rt = {
    // Terminal data
    active: true,   // Flag false when the session is ended (BYE sets it to false).
    height: 24,     // Vertical size of the terminal screen.
    in: "",         // Current input text.
    cursor: 0,      // Position of cursor in Input
    nonewline:false,// True if TTY_Print should continue to print on the last line of rt.out.
    prompt: ">",    // Prompt when asking for an input text
    out: [],        // Text printed so far.
    error: null,    // Error message after command.
    saved: true,    // False if the source text had been modified and not saved.
    width: 75,      // Horizontal size of the terminal screen.
    // Basic compiler data
    code: {},       // Object code.
    data: [],       // All data defined by DATA statements.
    dp: -1,         // Data pointer to a line containing just data
    lines: [],      // The ordered list of all source (and code) line numbers.
    lp: -1,         // Line pointer: during compilation, rt.source[rt.lp] is the
                    //  line under compiling; during execution,
                    //  rt.code[rt.lines[rt.lp]] is the line under execution.
    name: "DEFAULT",// Current source program name.
    source: {},     // Current source program: line number keyed table.
    vars: {},       // Variables at runtime.
};

/// MAIN PROGRAM: run the REPL as soon as the document is loaded.
document.addEventListener('DOMContentLoaded', async ()  => {
    TTY_Print("BASIC66 - A DARTMOUTH BASIC DIALECT");
    TTY_Print("(C) 2026 BY PAOLO CARESSA");
    TTY_Print("TERMINAL ON AT " + new Date().toDateString().toUpperCase());
    TTY_Print("READY");
    while (rt.active) {
        await TTY_Read()
        await CMD();
        if (rt.error) TTY_Print(rt.error);
    }
});

// Handle drag and drop of a file into the window.
const TERM = document.body;
//const TERM = document.getElementById("terminal");
TERM.addEventListener('dragover', e => {
    e.preventDefault();
    TERM.classList.add('dragover');
});
TERM.addEventListener('dragleave', () => { TERM.classList.remove('dragover'); });
TERM.addEventListener('drop', e => {
    e.preventDefault();
    TERM.classList.remove('dragover');
    const file = e.dataTransfer.files[0]
    CMD_Load_File(file);
});
TERM.focus();

//  T E R M I N A L

/// Convert a character into a HTML one: everything is uppercase here.
function TTY_Char(c) {
    return c.toUpperCase();
    /*return (c === "<") ? "&lt;" : (c === ">") ? "&gt;"
        : (c === "&") ? "&amp;"
            : c.toUpperCase();*/
}

/// Pause until any key is pressed.
async function TTY_Key() {
    return new Promise(resolve => {
        window.addEventListener("keydown", function handleKey(event) {
            window.removeEventListener("keydown", handleKey); // Clean up
            resolve(event.key); // Return the key name
});});}

/// Converts "\t" characters in spaces in a string.
function TTY_Explode_Tabs(s) {
    let t = "";
    for (let i = 0; i < s.length; ++ i)
        if (s[i] !== "\t") t += s[i];
        else {
            t += " ";
            while (t.length % 15 !== 0) t += " ";
        }
    return t;
}

/// Print a string on the terminal buffer: if the string is too long,
/// it is split in several lines
function TTY_Print(s) {
    if (rt.nonewline) {
        // Append to the last inserted line
        let line = TTY_Explode_Tabs(rt.out.pop() + s);
        rt.out.push(line.slice(0, rt.width));
        // If the line is too long, change s to the exceeding part
        // and use the code after the if block
        s = line.slice(rt.width);
        rt.nonewline = false;
    }
    s = TTY_Explode_Tabs(s);
    while (s.length >= rt.width) {
        rt.out.push(s.slice(0, rt.width));
        s = s.slice(rt.width);
    }
    if (s.length > 0) rt.out.push(s);
}

/// Refresh the terminal by printing rt.height lines from the start-th
/// on of the rt.out list.
function TTY_Refresh(start) {
    if (start === undefined) start = Math.max(0, rt.out.length - rt.height);
    let end = Math.min(start + rt.height, rt.out.length);
    let t = rt.out.slice(start, end);
    t.push(rt.prompt + rt.in.slice(0, rt.cursor) + "¦" + rt.in.slice(rt.cursor));
    document.getElementById("terminal").innerText = t.join("\n");
}

/// Read a text line, echoing its characters; return when Enter is pressed,
/// the read line is stored into rt.in.
async function TTY_Read() {
    rt.in = "";
    rt.cursor = 0;
    let start = rt.out.length - rt.height;
    if (start < 0) start = 0;
    for (;;) {
        TTY_Refresh(start);
        const key = await TTY_Key();
        //console.log(key);
        switch (key) {
            case 
             "Enter": TTY_Print(rt.prompt + rt.in); return;
            case "ArrowUp": if (start > 1) -- start; continue;
            case "ArrowDown": if 
             (start < rt.out.length - rt.height) ++ start; continue;
            case "ArrowLeft": if (rt.cursor > 0) --rt.cursor; continue;
            case "ArrowRight": if (rt.cursor < rt.in.length) ++rt.cursor; continue;
            case "Backspace":
                if (rt.cursor > 0) {
                    rt.in = rt.in.slice(0, rt.cursor - 1) + rt.in.slice(rt.cursor);
                    --rt.cursor;
                }
                continue;
            case "Delete":
                if (rt.cursor < rt.in.length) {
                    rt.in = rt.in.slice(0, rt.cursor) + rt.in.slice(rt.cursor + 1);
                }
                continue;
            default:
                if (key.length == 1) {
                    rt.in = rt.in.slice(0, rt.cursor) + TTY_Char(key) + rt.in.slice(rt.cursor);
                    ++rt.cursor;
}}}}

//
//  C O M M A N D   I N T E R P R E T E R
//

/// Transform a number into a line number (with preceding spaces if needed)
const CMD_Line_Number = (n) => ("   " + n).slice(-4);

// CMD_Commands.F(args) is a function which executes a command of the terminal
// inside the global runtime rt, accepting a string args as possible argument.
const CMD_Commands = {
    BYE: CMD_BYE, CODE: CMD_CODE, EXEC: CMD_EXEC, LIST: CMD_LIST,
    MERGE: CMD_MERGE, NEW: CMD_NEW, OLD: CMD_OLD, SAVE: CMD_SAVE
};

/// Parse and execute a system command from rt.in.
async function CMD() {
    rt.error = "OK";
    let text = rt.in.match(/^\s*(\d*)\s*(.*)\s*$/);
    // Here text[0] = rt.in, text[1] = line number, text[3] = rest of line.
    if (!text) return;
    let line_number = parseInt(text[1]);
    text = text[2].match(/^(\w+)\s*(.*)\s*$/);
    // Here text[0] = line after the number, text[1] = command, text[2] = command parameters.
    if (isFinite(line_number)) {      // line number editing
        rt.error = null;    // After line editing no OK not to clutter the screen.
        if (line_number == 0 || line_number > 9999) rt.error = "ILLEGAL LINE NUMBER";
        else if (text && text[0]) {
            rt.source[line_number] = text[0];
            rt.saved = false;
        } else if (rt.source[line_number]) {
            delete rt.source[line_number];
            rt.saved = false;
        } else rt.error = "ILLEGAL LINE NUMBER";
        return;
    }
    if (text) {    // Command
        if (CMD_Commands[text[1]]) await CMD_Commands[text[1]](text[2]);
        else rt.error = "ILLEGAL COMMAND";
    } else {    // Empty line
        rt.error = null;
    }
}

/// Execute each line of a text file as a command: if the line starts
/// with a line number, it has the same effect as introduced interactively.
async function CMD_Load_File(file) {
    if (file) {
        if (!rt.saved && !confirm("OVERWRITE UNSAVED PROGRAM?")) {
            TTY_Print(`FILE ${file.name} NOT LOADED`);
        } else {
            const text = (await file.text()).split("\n");
            const rtin = rt.in;
            for (let i = 0; i < text.length; ++i) {
                // Morally we are doing rt.in = text[i].map(TTY_Char).
                const t = text[i];
                rt.in = "";
                for (let j = 0; j < t.length; ++j)
                    rt.in += TTY_Char(t[j]);
                await CMD();
                if (rt.error && rt.error !== "OK")
                    TTY_Print(rt.error);
            }
            rt.in = rtin;
            rt.name = file.name;
            TTY_Print(`FILE ${file.name} LOADED`);
            rt.saved = true;
        }
        TTY_Refresh();
}}

async function CMD_BYE(args) {
    TTY_Print("GOODBYE");
    TTY_Print(`*** OFF AT ${new Date().toISOString().toUpperCase()}`);
    TTY_Refresh();
    rt.active = false;
}

/// Parse from args a pair first-last, where both first and last are optional:
/// if first is omitted then it is 0, if last is omitted then it is rt.lines.length.
async function CMD_Parse_first_last(list, args) {
    rt.lines = Object.keys(list).sort((a,b)=>(parseInt(a) < parseInt(b)));
    let first = 0;
    let last = rt.lines.length - 1;
    const nls = args.match(/^\s*(\d*)\s*\-\s*(\d*)\s*$/);
    // Here nls[1] = from line, text[2] = to line.
    if (nls && nls[1]) {
        const nls1 = parseInt(nls[1]);
        while (first <= last && rt.lines[first] < nls1)
            ++ first;
    }
    if (nls && nls[2]) {
        const nls2 = parseInt(nls[2]);
        while (first <= last && rt.lines[last] > nls2)
            -- last;
    }
    return {first: first, last: last};
}

/// List from the first to the last lines the list object: it assumes that
//  rt.lines contains the sorted list of all lines of the list argument.
async function CMD_Listing(list, first, last) {
    TTY_Print(" ");
    TTY_Print(` ${rt.name}`);
    TTY_Print(" ");
    let start = rt.out.length;
    while (first <= last) {
        // Prints a first chunk of the program on the screen
        for (let counter = 1; counter < rt.height && first <= last; ++counter, ++first)
            TTY_Print(CMD_Line_Number(rt.lines[first]) + " " + list[rt.lines[first]]);
        if (first > last) break;
        TTY_Refresh(start);
        document.getElementById("terminal").innerHTML += "PRESS A KEY TO CONTINUE";
        await TTY_Key();
        start += rt.height;
    }
    TTY_Refresh(start);
}

async function CMD_CODE(args) {
    const pair = await CMD_Parse_first_last(rt.code, args);
    await CMD_Listing(rt.code, pair.first, pair.last);
}

async function CMD_EXEC(args) {
    TTY_Print(" ");
    TTY_Print(` ${rt.name}  ${new Date().toISOString().toUpperCase()}`);
    TTY_Print(" ");
    if (rt.lines.length == 0) return;
    rt.stack = [];  // Return stack from GOSUBs
    rt.lp = 0;      // Index of line number in rt.lines to execute next.
    rt.dp = 0;      // Index of next DATA to be READ
    let t0 = new Date();
    try {
        do {
            ++ rt.lp;   // this could be altered by the evaluation below (eg GOTOs) 
                        // so we increase it before executing the code line.
console.log(`EXEC[${rt.lines[rt.lp - 1]}]`, rt.code[rt.lines[rt.lp - 1]]);
            await rt.code[rt.lines[rt.lp - 1]]();
        } while (rt.lp < rt.lines.length);
        TTY_Print(" ");
        TTY_Print(`TIME:  ${Math.floor((new Date() - t0))} MILLISECS.`);
    } catch (e) {
        rt.error = e + " IN " + rt.lines[rt.lp];
}}

async function CMD_LIST(args) {
    const pair = await CMD_Parse_first_last(rt.source, args);
    await CMD_Listing(rt.source, pair.first, pair.last);
}

async function CMD_MERGE(args) {
    // Create a fake input button and click on it.
    const input = document.createElement('input');
    input.type = "file";
    input.accept = ".BAS";
    input.onchange = async (event) => { CMD_Load_File(event.target.files[0]); };
    input.click();
}

async function CMD_NEW(args) {
    if (!args || args === "") rt.error = "FILE NAME MISSING";
    else if (!rt.saved && !confirm("ERASE CURRENT PROGRAM?")) {
        rt.error = "COMMAND ABORTED";
    } else {
        rt.name = (args.length > 8 ? args.slice(0, 8) : args) + ".BAS";
        rt.source = {};
        rt.saved = true;
}}

async function CMD_OLD(args) {
    if (!rt.saved && !confirm("ERASE CURRENT PROGRAM?")) {
        rt.error = "COMMAND ABORTED";
    } else {
        rt.name = (args.length > 8 ? args.slice(0, 8) : args) + ".BAS";
        rt.source = {};
        rt.saved = true;
        CMD_MERGE(args);
}}

async function CMD_SAVE(args) {
    if (rt.saved) {
        TTY_Print(`FILE ${rt.name} ALREADY SAVED`);
        return;
    }
    const text = [];
    for (const line in rt.source)
        text.push(CMD_Line_Number(line), " ", rt.source[line], "\n");
    const blob = new Blob(text, { type: 'application/basic' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = rt.name + ".BAS";
    a.click();
    URL.revokeObjectURL(url);
    rt.saved = true;
}

//
//  B A S I C   C O M P I L E R
//

const BASIC_Keywords =  {
    CHANGE: BASIC_CHANGE, DATA: BASIC_DATA, DIM: BASIC_DIM, END: BASIC_END,
    FOR: BASIC_FOR, GO: BASIC_GO, GOSUB: BASIC_GOSUB, GOTO: BASIC_GOTO,
    IF: BASIC_IF, INPUT: BASIC_INPUT, LET: BASIC_LET, MAT: BASIC_MAT,
    NEXT: BASIC_NEXT, ON: BASIC_ON, PRINT: BASIC_PRINT,
    RANDOMIZE: BASIC_RANDOMIZE, READ: BASIC_READ, REM: BASIC_REM,
    RESTORE: BASIC_RESTORE, RETURN: BASIC_RETURN, STOP: BASIC_STOP
};

const BASIC_Functions = {
    ABS: BASIC_ABS, ASC: BASIC_ASC, ATN: BASIC_ATN, CHR$: BASIC_CHR$,
    COS: BASIC_COS, EXP: BASIC_EXP, INT: BASIC_INT, LEN: BASIC_LEN,
    LOG: BASIC_LOG, RND: BASIC_RND, SGN: BASIC_SGN, SIN: BASIC_SIN,
    SQR: BASIC_SQR, TAN: BASIC_TAN
};

CMD_Commands.BASIC = CMD_BASIC;
CMD_Commands.RUN = CMD_RUN;
CMD_Commands.VARS = CMD_VARS;

/// Compile rt.source into rt.code, rt.data and rt.vars.
async function CMD_BASIC(args) {
    rt.error = "OK";
    rt.noend = true;
    rt.code = {};
    rt.data = [];
    rt.vars = {};
    rt.lines = Object.keys(rt.source).sort((a,b)=>(parseInt(a) < parseInt(b)));
    try {
        for (rt.lp of rt.lines) {
            const tokens = BASIC_Parse();
            if (tokens[0].type === "keyword") tokens[0].token(tokens);  // tokens[0].token is a function!
            else throw "ILLEGAL INSTRUCTION";
        }
        if (rt.noend) throw "NO END INSTRUCTION";
    } catch (e) {
        rt.error = e;
        if (rt.lp >= rt.lines[0] && rt.lp <= rt.lines.at(-1))
            rt.error += " IN " + rt.lp;
}}

async function CMD_RUN(args) {
    await CMD_BASIC(args);
    if (rt.error === "OK") await CMD_EXEC(args);
}

async function CMD_VARS(args) {
    const names = Object.keys(rt.vars).sort();
    let start = rt.out.length;
    for (let i = 0; i < names.length; /* inside for loop */) {
        // Prints a first chunk of the program on the screen
        for (let counter = 1; counter < rt.height && i < names.length; ++counter, ++i) {
            let name = names[i];
            if (name.at(-1) == '@') name = name.slice(0,-1) + "()";   
            TTY_Print(`${name} = ${rt.vars[names[i]].value}`);
        }
        if (i == names.length) break;
        TTY_Refresh(start);
        document.getElementById("terminal").innerHTML += "PRESS A KEY TO CONTINUE";
        await TTY_Key();
        start += rt.height;
    }
    TTY_Refresh(start);
}

/// Parse line rt.lp of the BASIC source and return the list of parsed tokens,
/// which are pairs {type:"...", token:...), where type can be: "number",
/// "string", "keyword", "variable" or in case of delimiter the delimiter
/// itself. Values are numbers, strings, functions, strings (key to rt.vars).
/// The last token of the list is always {type:"eol", token:null}.
function BASIC_Parse() {
    let s = rt.source[rt.lp];
    const isalpha = (c) => (c >= "a" && c <= "z" || c >= "A" && c <= "Z");
    const isalnum = (c) => (isalpha(c) || c >= "0" && c <= "9");
    let tokens = [];
    s = s + " ";   // useful when to check the last character of s.
    let i = 0;
    while (i < s.length) {
        if (s[i] < " " || s[i] > "~") throw "ILLEGAL CHARACTER";
        // Check against a number in the first place.
        const r = /(:?\d+(?:\.\d+)?|\.\d+)(:?\E[+-]?\d+)?/y;
        r.lastIndex = i;
        const match = r.exec(s);
        if (match) {
            let n = Number(match[0]);
            if (!isFinite(n)) throw "ILLEGAL CONSTANT";
            tokens.push({type: "number", token: n});
            i = r.lastIndex;
        } else if (s[i] === " ") {         // Ignore blanks.
            ++i;
        } else if (s[i] === "'") {  // Comment until the end of line
            break;
        } else if (s[i] === '"') {  // String
            let j = s.indexOf('"', i + 1);
            if (j < 0) throw "UNTERMINATED STRING";
            tokens.push({type: "string", token: s.slice(i + 1, j)});
            i = j + 1;
        } else if (isalpha(s[i])) { // Identifier
            let t = s[i];
            for (++i; isalnum(s[i]); ++i)
                t += s[i];
            t = t.toUpperCase();
            // Include possible dollar sign.
            if (s[i] === "$") { t += "$"; ++i; }
            // Keyword or variable.
            tokens.push(BASIC_Keywords[t] ? {type: "keyword", token: BASIC_Keywords[t]}
                : BASIC_Functions[t] ? {type: "function", token: BASIC_Functions[t]}
                : { type: "variable", token: t });
        } else if (s[i] === "<" && s[i+1] === "=") {
            tokens.push({type: "<=", token: "<="});
            i += 2;
        } else if (s[i] === "<" && s[i+1] === ">") {
            tokens.push({type: "!=", token: "<>"});
            i += 2;
        } else if (s[i] === ">" && s[i+1] === "=") {
            tokens.push({type: ">=", token: ">="});
            i += 2;
        } else if (s[i] === "=") {
            tokens.push({type: "==", token: "="});
            ++ i;
        } else {  // Delimiter!
            tokens.push({type: s[i], token: s[i]});
            ++i;
    }}
    tokens.push({ type: "eol", token: null });
    return tokens;
}

/// Compile an expression from the t-th token of tokens on and return an object
//  {type:..., code: ..., t: ...} where type is "number" or "string", code is the
//  string compiling the expression and t is the first token in tokens after the
//  expression.
function BASIC_Expression(tokens, t) {
    let code = "";
    let type = null;
    for (;;) {
        const opd = BASIC_Operand(tokens, t);
        if (type) { if (type != opd.type) throw "MISMATCHED STRING OPERATION"; }
        else type = opd.type;
        code += opd.code;
        t = opd.t;
        if (tokens[t].type === "^") {
            if (type !== "number") throw "MISMATCHED STRING OPERATION";
            code += "**";
        } else {
            if ("+-*/".indexOf(tokens[t].type) < 0) return {type: type, code: code, t: t};
            if (type !== "number") throw "MISMATCHED STRING OPERATION";
            code += tokens[t].type;
        }
        ++ t;
}}

/// Compile an expression operand and return an object {type: ..., code: ...,
//  t: ...} where type is "string" or "number", code is the compiled code of
//  the operand and t is the index of the next token in tokens. On error,
//  an exception it thrown.
function BASIC_Operand(tokens, t) {
    let code = "";
    let type = null;
    for (;;) {
        switch (tokens[t].type) {
            case "string":
                // A string is a N + 1 vector of characters where the 0-th one
                // is the length.
                return {type: "string", code: code + `"${tokens[t].token}"`, t: t + 1};
            case "number":
                return {type: "number", code: code + "" + tokens[t].token, t: t + 1};
            case "-":
                if (type === "string") break;
                code += "-";
                ++t;
                continue;
            case "(":
                let e = BASIC_Expression(tokens, t + 1);
                if (tokens[e.t].type !== ")") throw "\")\" EXPECTED";
                e.code = code + "(" + e.code + ")";
                ++ e.t; // skip the ')'
                return e;
            case "variable":
                let v = BASIC_Variable_Value(tokens, t);
                v.code = code + v.code;
                return v;
            case "function":
                return tokens[t].token(tokens, t + 1);
        }
        throw "ILLEGAL FORMULA";
}}

function BASIC_Relation(tokens, t) {
    const e1 = BASIC_Expression(tokens, t);
    const type = e1.type;
    let code = e1.code;
    t = e1.t;
    const toktype = tokens[t].type;
    if (toktype === "<" || toktype === "<=" || toktype === "!=" || toktype === ">"
    || toktype === ">=" || toktype === "==") {
        code += toktype;
        ++ t;
    } else throw "ILLEGAL RELATION";
    const e2 = BASIC_Expression(tokens, t);
    if (type !== e2.type) throw "MISMATCHED STRING OPERATION";
    code += e2.code;
    return {code: code, t: e2.t};
}

/// Compile a single or pair of subscript indexes: it returns an object
//  {d1: ..., d2: ..., t: ...} where d1 and d2 contains the code compiling the
//  indexes and t the index in tokens of the first token following the subscript.
function BASIC_Subscript(tokens, t) {
    // First index.
    let i = BASIC_Expression(tokens, t + 1);
    if (i.type !== "number") throw "MISMATCHED STRING OPERATION";
    let d1 = i.code;
    let d2 = "0";
    t = i.t;
    // Possible second index.
    if (tokens[t].type === ",") {
        i = BASIC_Expression(tokens, t + 1);
        if (i.type !== "number") throw "MISMATCHED STRING OPERATION";
        d2 = i.code;
        t = i.t;
    }
    if (tokens[t].type !== ")") throw "\")\" EXPECTED";
    ++ t;   // skip the closing ")".
    return {d1: d1, d2: d2, t: t};
}

/// Insert a new variable in the rt.vars symbol table, with given initial value.
function BASIC_Variable_Insert(v, init, d1 = 0, d2 = 0) {
    if (d1 === 0) {       // Scalar variable
        rt.vars[v] = {value: init};
    } else {                // Array variable
        rt.vars[v] = {d1: d1, d2: d2, value: new Array((d1 + 1)*(d2 + 1)).fill(init)};
    }
}

/// Compile the assignment of the value of a BASIC variable, possibly with indexes:
//  an object {type: ..., code: ..., t: ...} is returned, where type is "number"
//  or "string", code is the string compiling the variable reference and t is the
//  first token in tokens after the expression. The returned code has the form
//  "... =" and must be completed with the RHS of the assignment.
function BASIC_Variable_Assign(tokens, t) {
    if (tokens[t].type !== "variable") throw "ILLEGAL VARIABLE";
    let v = tokens[t].token;
    const type = v.at(-1) === "$" ? "string" : "number";
    const init = type === "number" ? "0" : "''";
    if (tokens[++t].type !== "(") { // Scalar variable
        code = `rt.vars.${v}.value=`;
        if (!rt.vars[v]) BASIC_Variable_Insert(v, init);
    } else {                        // Array variable
        v += "@";                   // suffix in rt.vars for array variables
        let i = BASIC_Subscript(tokens, t);
        code = `const offset=${i.d1}+${i.d2}*rt.vars["${v}"].d1;if(rt.vars["${v}"].value[offset]===undefined)throw "SUBSCRIPT ERROR";rt.vars["${v}"].value[offset]=`;
        if (!rt.vars[v]) BASIC_Variable_Insert(v, init, 10, i.d2 === "0" ? 0 : 10);
        t = i.t;
    }
    return {type: type, code: code, t: t};
}

/// Compile the retrieval of the value of a BASIC variable, possibly with indexes:
//  an object {type: ..., code: ..., t: ...} is returned, where type is "number" or
//  "string", code is the string compiling the variable reference and t is the first
//  token in tokens after the expression. This is used to compile the retrieval of
//  the variable's value. Notice that variables not mentioned so far are inserted
//  in the symbol table rt.vars at compile time, with the default value 0 for
//  numerical variables, "" for string variables.
function BASIC_Variable_Value(tokens, t) {
    let v = tokens[t].token;
    const type = v.at(-1) === "$" ? "string" : "number";
    const init = type === "number" ? 0 : "";
    if (tokens[++t].type !== "(") { // Scalar variable
        // Compile the code that compute the values of the variable at.
        code = `(rt.vars.${v}.value)`;
        if (!rt.vars[v]) BASIC_Variable_Insert(v, init);
    } else {                        // Array variable
        v += "@";                   // suffix in rt.vars for array variables
        let i = BASIC_Subscript(tokens, t);
        // Compile the code that compute the values of a function at runtime:
        //  it is a JS function returning the value or throwing an exception.
        code = `(()=>{const offset=${i.d1}+${i.d2}*rt.vars["${v}"].d1;if(!rt.vars["${v}"].value[offset])throw"SUBSCRIPT ERROR";return rt.vars["${v}"].value[offset];})()`;
        if (!rt.vars[v]) BASIC_Variable_Insert(v, init, 10, d2 === "0" ? 0 : 10);
        t = i.t;
    }
    return {type: type, t: t, code: code};
}

/// Peform a binary search inside rt.lines, returning the index in
/// rt.lines of the source line number line.
function BASIC_Line_Lookup(line) {
    // Bare binary search that JS still lacks.
    let start = 0, end = rt.lines.length - 1;
    while (start <= end) {
        let mid = Math.floor(start + (end - start) / 2);
        if (line == rt.lines[mid]) return mid;
        if (line < rt.lines[mid]) end = mid - 1;
        else start = mid + 1;
    }
    return -1;
}

//  FUNCTIONS COMPILING BASIC STATEMENTS
/*
    A source line rt.source[n] is compiled to the object code in
    rt.code[n], which is just a JS function to be called at runtime.

    Each line is compiled in an independent way from the others,
    no need to keep track of location where to jump since we use
    the same line numbers for the object code as for the source one.

    The prototype of each compiling function is

        BASIC_KEYWORD(line, tokens)
    
    where rt is the runtime, line the line number of the line under
    compiling and tokens the list of tokens of the source code.

    The function has the side effect of setting rt.code[line] to
    the compiled code, or to throw an exception in case of error.
*/

/// Constructor of an object code function.
const BASIC_Code = Object.getPrototypeOf(async function(){}).constructor;

/// Runtime function that changes a string into a vector: the 0-th item of
/// the vector contains the string length.
async function BASIC_RT_CHANGE(from, to) {
    if (!rt.vars[from]) throw `VARIABLE ${from} DOES NOT EXISTS IN ${rt.lines[rt.lp-1]}`;
    if (from.at(-1) === "@") throw `CANNOT CHANGE FROM A STRING ARRAY IN ${rt.lines[rt.lp-1]}`;
    if (!rt.vars[to]) throw `VARIABLE ${to} DOES NOT EXISTS IN ${rt.lines[rt.lp-1]}`;
    const vfrom = rt.vars[from].value, vto = rt.vars[to].value;
    if (vto.d1 < vfrom.length) throw `DESTINATION ARRAY TOO SMALL IN ${rt.lines[rt.lp-1]}`;
    // Ok, we can perform the copy
    vto[0] = vfrom.length;
    for (let i = 0; i < vfrom.length; ++ i)
        vto[i + 1] = vfrom.charCodeAt(i);
}

/// Runtime function that changes a vector into a string: the 0-th item of
/// the vector contains the string length.
async function BASIC_RT_CHANGE$(from, to) {
    if (to.at(-1) === "@") throw `CANNOT CHANGE TO A STRING ARRAY IN ${rt.lines[rt.lp-1]}`;
    if (!rt.vars[from]) throw `VARIABLE ${from} DOES NOT EXISTS IN ${rt.lines[rt.lp-1]}`;
    if (!rt.vars[to]) rt.vars[to] = {};
    const vfrom = rt.vars[from].value, vto = rt.vars[to];
    // Ok, we can perform the copy
    vto.value = "";
    for (let i = 0; i < vfrom[0]; ++ i)
        vto.value += String.fromCharCode(vfrom[i+1]);
}

/** The CHANGE statement can have two forms:
        CHANGE X$ TO X
        CHANGE X TO X$
    In the first form, the string X$, which should exist and that cannot be an
    element in an array of strings, is changed to a vector X which should exist
    and have at least N dimensions, being N the length of the string. In the 0-th
    element of the vector the length of the string is stored.
    In the second form, the vector X(), which should exist and have at least as
    much items as the number X(0) is, is converted to a string, which is created
    or overwritten.     */
function BASIC_CHANGE(tokens) {
    if (tokens[1].type !== "variable" || tokens[2].token !== "TO"
    || tokens[3].type !== "variable") throw "ILLEGAL FORMAT";
    let from = tokens[1].token;
    let to = tokens[3].token;
    const from_type = from.at(-1) === "$" ? "string" : "number";
    const to_type = to.at(-1) === "$" ? "string" : "number";
    if (from_type === to_type) throw "MISMATCHED STRING OPERATION";
    // The non string variable should be a vector
    if (from_type === "string") to += "@"; else from += "@";
    rt.code[rt.lp] = BASIC_Code("await "
        + ((from_type === "number") ? "BASIC_RT_CHANGE$" : "BASIC_RT_CHANGE")
        + `('${from}','${to}');`);
}

/// This does not compile code, but parse constants that are stored
/// in the rt.ddata array.
function BASIC_DATA(tokens) {
    let t = 1;
    for (;;) {
        // [-+] number | string
        if (tokens[t].type === "number" || tokens[t].type === "string") {
            rt.data.push(tokens[t].token);
            ++ t;
        } else if ((tokens[t].type === "+" || tokens[t].type === "-")
        && tokens[t+1].type === "number") {
            rt.data.push(parseFloat(tokens[t].type + tokens[t+1].token));
            t += 2;
        } else {
            throw "ILLEGAL CONSTANT";
        }
        if (tokens[t].type === "eol") break;
        if (tokens[t].type !== ",") throw "ILLEGAL FORMAT";
        ++t;   // Skip the comma
    }
    rt.code[rt.lp] = BASIC_Code(""); // void function, the line ought to exists since it could be targeted by a GOTO.
}

function BASIC_DIM(tokens) {
    let t = 0;
    let code = "";
    do {
        if (tokens[++t].type !== "variable") throw "ILLEGAL VARIABLE";
        const v = tokens[t].token + "@";
        if (rt.vars[v]) throw "DIMENSION ERROR";
        const init = v.at(-2) === "$" ? "" : 0;
        // Subscript indexes must be numerical constants.
        if (tokens[++t].type !== "(") throw "\"(\" EXPECTED";
        if (tokens[++t].type !== "number") throw "MISMATCHED STRING OPERATION";
        let d1 = tokens[t].token;
        let d2 = 0;
        if (tokens[++t].type === ",") {
            if (tokens[++t].type !== "number") throw "MISMATCHED STRING OPERATION";
            d2 = tokens[t].token;
            ++ t;
        }
        if (tokens[t].type !== ")") throw "\")\" EXPECTED";
        if (d1 < 1) throw "SUBSCRIPT ERROR";
        BASIC_Variable_Insert(v, 0, d1, d2);
    } while (tokens[++t].type === ",");
    if (tokens[t].type !== "eol") throw "ILLEGAL FORMAT";
    rt.code[rt.lp] = BASIC_Code("");
}

function BASIC_END(tokens) {
    if (rt.lp != rt.lines[rt.lines.length - 1]) throw "END IS NOT LAST";
    rt.noend = false;
    rt.code[rt.lp] = BASIC_Code("");
}

/// FOR compiles an assignment which adds some more keys in the rt.vars.V object
/// encoding the assigned variable V, namely a for:lp key whose value is the one
/// to assing to rt.lp to iterate the loop, the to value and the step.
/// In our simple minded compilation line-by-line, we have a difficulty, here,
/// namely to skip to the corresponding NEXT statement if the loop shouldn't be
/// executed at all. The Basic 4th Manual is clear: "if For a positive step-size,
/// the loop continues as long as the control variable is less than or equal to
/// the final value. For a negative step-size, the loop continues as long as the
/// control variable is greater than or equal to the final value. If the initial
/// value is greater than the final value (less than for negative step-size),
/// then the body of the loop will not be performed at all, but the computer will
/// immediately pass to the statement following the NEXT".
function BASIC_FOR(tokens) {
    // Scalar numerical variable expected at tokens[1].
    const name = tokens[1].token;
    if (tokens[1].type !== "variable" || name.at(-1) === "$"
    || tokens[2].type !== "==") throw "ILLEGAL FORMAT";
    let e = BASIC_Variable_Assign(tokens, 1);
    let code = e.code;
    e = BASIC_Expression(tokens, e.t + 1);  // +1 because we skip the "=".
    if (e.type !== "number") throw "MISMATCHED STRING OPERATION";
    code += e.code + ";";
    if (tokens[e.t].token !== "TO") throw "ILLEGAL FORMAT";
    e = BASIC_Expression(tokens, e.t + 1);
    if (e.type !== "number") throw "MISMATCHED STRING OPERATION";
    code += `const v=rt.vars.${name};v.for=rt.lp;v.to=${e.code};v.step=1;`;
    if (tokens[e.t].token === "STEP") {
        e = BASIC_Expression(tokens, e.t + 1);
        if (e.type !== "number") throw "MISMATCHED STRING OPERATION";
        code += `v.step=${e.code};`;
    }
    if (tokens[e.t].type !== "eol") throw "ILLEGAL FORMAT";
    // If the next condition is violated the FOR loop is not executed,
    // hence we look for the corresponding NEXT instruction and jump
    // to it at runtime.
    let index = BASIC_Line_Lookup(rt.lp) + 1;
    const next_i = new RegExp(`^NEXT\\s+${name}$`);
    while (index < rt.lines.length && !rt.source[rt.lines[index]].match(next_i)) {
        ++ index;
    }
    if (index == rt.lines.length) throw "FOR WITHOUT NEXT";
    code += `if((v.step<=0||v.value>v.to)&&(v.step>=0||v.value<v.to))rt.lp=${index};`
    rt.code[rt.lp] = BASIC_Code(code);
}

/// Check that tokens[0] is a line number and tokens[1] is "eol", and compile
//  a jump into rt.code[rt.lp] preceded by code.
function BASIC_Compile_jump(tokens, code) {
    if (tokens[0].type != "number") throw "ILLEGAL LINE NUMBER";
    if (tokens[1].type !== "eol") throw "ILLEGAL FORMAT";
    // Check if there's a line number tokens[0].tokens and retrieve its index in lines.
    const index = BASIC_Line_Lookup(tokens[0].token);
    if (index < 0) throw "ILLEGAL LINE NUMBER";
    rt.code[rt.lp] = BASIC_Code(code + `rt.lp=${index};`);
}

function BASIC_GO(tokens) {
    switch (tokens[1].token) {
        case "TO": BASIC_GOTO(tokens.slice(1)); break;
        case "SUB": BASIC_GOSUB(tokens.slice(1)); break;
        default: throw "ILLEGAL INSTRUCTION";
}}

function BASIC_GOSUB(tokens) {
    BASIC_Compile_jump(tokens.slice(1), "rt.stack.push(rt.lp);");
}

function BASIC_GOTO(tokens) {
    BASIC_Compile_jump(tokens.slice(1), "");
}

function BASIC_IF(tokens) {
    let code = "if(";
    const c = BASIC_Relation(tokens, 1);
    code += c.code + ")";
    if (tokens[c.t].token !== "THEN" && tokens[c.t].token !== "GOTO"
    && tokens[c.t].token !== "GO" && tokens[c.t+1].token !== "TO")
        throw "ILLEGAL FORMAT";
    BASIC_Compile_jump(tokens.slice(c.t + 1), code);
}

function BASIC_INPUT(tokens) {
    let t = 1;
    let code = "";
    for (;;) {
        // Since code will be processed by eval, we wrap the async TTY_Read inside a IIFE.
        code += `prompt=rt.prompt;rt.prompt="?";rt.in='';rt.cursor=0;await TTY_Read();`
        const v = BASIC_Variable_Assign(tokens, t);
        // Compile the runtime function that parses a text line and parses
        // a value of the given type from it. 
        code += v.code + ((v.type === "number") ? "parseFloat(rt.in);" : "rt.in;");
        t = v.t;
        if (tokens[t].type === "eol") break;
        if (tokens[t].type !== ",") throw "ILLEGAL FORMAT";
        ++t;   // Skip the comma
    }
    rt.code[rt.lp] = BASIC_Code(code + "rt.prompt=prompt;");
}

function BASIC_LET(tokens) {
    const v = BASIC_Variable_Assign(tokens, 1);
    const type = v.type;
    let code = v.code;
    let t = v.t;
    if (tokens[t].type !== "==") throw "\"=\" EXPECTED";
    const e = BASIC_Expression(tokens, t + 1);
    if (e.type !== type) throw "MISMATCHED STRING OPERATION";
    code += `${e.code};`;
    if (tokens[e.t].type !== "eol") throw "ILLEGAL FORMAT";
    rt.code[rt.lp] = BASIC_Code(code);
}

function BASIC_MAT(tokens) {
    rt.code[line] = BASIC_Code("alert(\"TODO!\")");
}

function BASIC_NEXT(tokens) {
    const v = tokens[1].token;
    if (tokens[1].type !== "variable" || v.at(-1) == "$" || tokens[2].type !== "eol") throw "ILLEGAL FORMAT";
    if (!rt.vars[v]) BASIC_Variable_Insert(v, 0);
    // Compile the code that perform the check on the variable
    // and possily iterate the loop.
    rt.code[rt.lp] = BASIC_Code(`const v=rt.vars.${v};if(!v.for)throw"NEXT WITHOUT FOR";v.value+=v.step;if((v.step>0&&v.value<=v.to)||(v.step<0&&v.value>=v.to))rt.lp=v.for;`);
}

function BASIC_ON(tokens) {
    const e = BASIC_Expression(tokens, 1);
    if (e.type !== "number") throw "MISMATCHED STRING OPERATION";
    if (tokens[e.t].token !== "THEN" && tokens[e.t].token !== "GOTO"
    && tokens[e.t].token !== "GO" && tokens[e.t+1].token !== "TO")
        throw "ILLEGAL FORMAT";
    let t = e.t + (tokens[e.t+1].token !== "TO" ? 2 : 1);
    // Now parse the list of possible line numbers, converting them to indexes
    // in rt.lines. In the runtime code, the integer part of the expression
    // will index the corresponding line to jump to.
    let code = `const a=[`;
    do {
        if (tokens[t].type !== "number") throw "ILLEGAL LINE REFERENCE";
        const index = BASIC_Line_Lookup(tokens[t].token);
        if (index < 0) throw "ILLEGAL LINE NUMBER";
        code += index + ",";
        ++ t;
    } while (tokens[t++].type === ",");
    if (tokens[t-1].type !== "eol") throw "ILLEGAL FORMAT";
    code += `];const i=Math.floor(${e.code})-1;if(i<0||i>=a.length)throw"ON EVALUATED OUT OF RANGE";rt.lp=a[i];`
    rt.code[rt.lp] = BASIC_Code(code);
}

function BASIC_PRINT(tokens) {
    let t = 1;
    let code = "let p='';";
    let newline = true;     // true if a newline should be issued after printing.
    let last_was_number = false;
    while (tokens[t].type !== "eol") {
        if (tokens[t].type === "string") {
            // After a string there's no need for "," or ";"
            code += `p+="${tokens[t].token}";`;
            ++ t;
            newline = true;
            continue;
        }
        if (tokens[t].type === ",") {
            code += "p+='\t';";
            ++ t;
            newline = false;
            continue;
        }
        if (tokens[t].type === ";") {
            ++ t;
            newline = false;
            continue;
        }
        const e = BASIC_Expression(tokens, t);
        newline = true;
        if (e.type === "string") code += `p+=${e.code};`;
        else code += `p+=" "+(${e.code});`;
        t = e.t;
    }
    code += "TTY_Print(p);TTY_Refresh();";
    if (!newline) code += "rt.nonewline=true";
    rt.code[rt.lp] = BASIC_Code(code);
}

function BASIC_RANDOMIZE(tokens) {
    rt.code[rt.lp] = BASIC_Code("const s=Math.floor(performance.now()*1000)%2147483647;rt.seed=(s===0?1:s);")
}

/// The behaviour of INPUT in this version of BASIC is such that strings
/// are always read in a single line, as in LINE INPUT of some dialects.
function BASIC_RT_READ(type) {
    if (rt.dp >= rt.data.length) throw "OUT OF DATA";
    const d = rt.data[rt.dp++];
    if (typeof d !== type) throw "NO " + (type === "number" ? "NUMERIC" : "STRING") + " DATA";
    return d;
}

function BASIC_READ(tokens) {
    let t = 1;
    let code = "";
    for (;;) {
        const v = BASIC_Variable_Assign(tokens, t);
        // Compile the runtime function that reads the next DATA element. 
        code += v.code + `BASIC_RT_READ("${v.type}");`;
        t = v.t;
        if (tokens[t].type === "eol") break;
        if (tokens[t].type !== ",") throw "INVALID FORMAT";
        ++t;   // Skip the comma
    }
    rt.code[rt.lp] = BASIC_Code(code);
}

function BASIC_REM(tokens) {
    rt.code[rt.lp] = BASIC_Code("");
}

function BASIC_RESTORE(tokens) {
    rt.code[rt.lp] = BASIC_Code("rt.dp=0;");
}

function BASIC_RETURN(tokens) {
    rt.code[rt.lp] = BASIC_Code(`if(rt.stack.length===0) throw "RETURN WITHOUT GOSUB";rt.lp=rt.stack.pop();`);
}

function BASIC_STOP(tokens) {
    // Compile the code to end the program.
    rt.code[line] = BASIC_Code("rt.lp=rt.lines.length;rt.error='STOP';");
}

//  FUNCTIONS COMPILING BASIC FUNCTIONS

/// Parameters of the classic congruential random generator
///  LCG standard (MINSTD / Park-Miller)
rt.seed = 1;
rt.rnda = 48271;
rt.rndm = 2147483647;

function BASIC_RT_RND() {
    rt.seed = (rt.rnda * rt.seed) % rt.rndm;
    return rt.seed / rt.rndm;
}

/// RND accepts no parameters.
function BASIC_RND(tokens, t) {
    return {type: "number", code: "(BASIC_RT_RND())", t: t};
}

/// Compile a generic numerical function with numerical argument.
function BASIC_Func(tokens, t, jsfun) {
    const o = BASIC_Operand(tokens, t);
    if (o.type !== "number") throw "MISMATCHED STRING OPERATION";
    o.code = `${jsfun}(${o.code})`;
    return o;
}

function BASIC_ABS(tokens, t) { return BASIC_Func(tokens, t, "Math.abs"); }
function BASIC_ATN(tokens, t) { return BASIC_Func(tokens, t, "Math.atan"); }
function BASIC_COS(tokens, t) { return BASIC_Func(tokens, t, "Math.cos"); }
function BASIC_EXP(tokens, t) { return BASIC_Func(tokens, t, "Math.exp"); }
function BASIC_INT(tokens, t) { return BASIC_Func(tokens, t, "Math.floor"); }
function BASIC_LOG(tokens, t) { return BASIC_Func(tokens, t, "Math.log"); }
//function BASIC_RND(tokens, t) { return BASIC_Func(tokens, t, "Math.random"); }
function BASIC_SGN(tokens, t) { return BASIC_Func(tokens, t, "Math.sign"); }
function BASIC_SIN(tokens, t) { return BASIC_Func(tokens, t, "Math.sin"); }
function BASIC_SQR(tokens, t) { return BASIC_Func(tokens, t, "Math.sqrt"); }
function BASIC_TAN(tokens, t) { return BASIC_Func(tokens, t, "Math.tan"); }

function BASIC_ASC(tokens, t) {
    const o = BASIC_Operand(tokens, t);
    if (o.type !== "string") throw "MISMATCHED STRING OPERATION";
    o.code += `((${o.code}).charCodeAt(0)||0)`;
    o.type = "number";
    return o;
}

function BASIC_CHR$(tokens, t) {
    const o = BASIC_Operand(tokens, t);
    if (o.type !== "number") throw "MISMATCHED STRING OPERATION";
    o.code = `(String.fromCharCode(${o.code}))`;
    o.type = "string";
    return o;
}

function BASIC_LEN(tokens, t) {
    const o = BASIC_Operand(tokens, t);
    if (o.type !== "string") throw "MISMATCHED STRING OPERATION";
    o.code = `((${o.code}).length)`;
    o.type = "number";
    return o;
}

</script>
